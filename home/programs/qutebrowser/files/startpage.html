<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@host@</title>
    <style>
      :root {
        --bg: #@base00@;
        --muted: #@base04@;
        --fg: #@base05@;
        --accent: #@base0B@;
        --mono: "@mono@", monospace;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-content: center;
        gap: 0.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        text-align: center;
      }

      #clock,
      #date {
        width: 11rem;
      }

      #clock {
        font-size: 3rem;
        line-height: 1.1;
      }

      #date {
        color: var(--accent);
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: lowercase;
      }

      #quote {
        max-width: 32rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>

  <body>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="quote" hidden></div>

    <script>
      const quotes = @quotes@;
      let quoteIndex = 0;
      const pad = (n) => String(n).padStart(2, "0");
      const tick = () => {
        const d = new Date();
        document.getElementById("clock").textContent =
          pad(d.getHours()) + ":" + pad(d.getMinutes());
        document.getElementById("date").textContent = d
          .toLocaleDateString(undefined, {
            weekday: "short",
            day: "2-digit",
            month: "short",
          })
          .toLowerCase();
      };
      const rotateQuote = () => {
        if (quotes.length === 0) return;
        const quote = document.getElementById("quote");
        quote.textContent = quotes[quoteIndex];
        quote.hidden = false;
        quoteIndex = (quoteIndex + 1) % quotes.length;
      };

      tick();
      rotateQuote();
      setInterval(tick, 1000);
      setInterval(rotateQuote, 15_000);
    </script>
  </body>
</html>
