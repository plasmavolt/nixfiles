<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@host@</title>
    <style>
      :root {
        --bg: #@base00@;
        --fg: #@base05@;
        --accent: #@base0D@;
        --mono: "@mono@", monospace;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-content: center;
        gap: 0.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        text-align: center;
      }

      #clock,
      #date {
        width: 11rem;
      }

      #clock {
        font-size: 3rem;
        line-height: 1.1;
      }

      #date {
        color: var(--accent);
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: lowercase;
      }
    </style>
  </head>

  <body>
    <div id="clock">--:--</div>
    <div id="date"></div>

    <script>
      const pad = (n) => String(n).padStart(2, "0");
      const tick = () => {
        const d = new Date();
        document.getElementById("clock").textContent =
          pad(d.getHours()) + ":" + pad(d.getMinutes());
        document.getElementById("date").textContent = d
          .toLocaleDateString(undefined, {
            weekday: "short",
            day: "2-digit",
            month: "short",
          })
          .toLowerCase();
      };

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
